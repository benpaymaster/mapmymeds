[profile.default]
src = "contracts"
test = "tests/smart_contracts"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = true

[lint]
# Each exclusion is a deliberate design decision, documented in docs/SECURITY_REVIEW.md:
# - screaming-snake-case-immutable: registry() reads better than REGISTRY() for integrators
# - block-timestamp: expiry windows are hours to months; validator drift of seconds is irrelevant
# - unsafe-oz-erc721-mint: SettlementTicket uses _mint on purpose so no callback (reentrancy path) exists
exclude_lints = ["screaming-snake-case-immutable", "block-timestamp", "unsafe-oz-erc721-mint"]
# Lint production code only; tests and scripts use cheatcodes that trip style lints by design.
ignore = ["tests/**", "script/**"]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 100
fail_on_revert = true
