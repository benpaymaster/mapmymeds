[profile.default]
src = "contracts"
test = "tests/smart_contracts"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "../src/=contracts/"
]

[rpc_endpoints]
base_sepolia = "https://base-sepolia.g.alchemy.com/v2/YOUR_ALCHEMY_KEY"

[etherscan]
base_sepolia = { key = "YOUR_BASESCAN_API_KEY" }