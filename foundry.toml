[profile.default]
src = "contracts"
test = "tests/smart_contracts"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = true

[lint]
# Public immutables read better as registry() than REGISTRY() for integrators.
exclude_lints = ["screaming-snake-case-immutable"]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 100
fail_on_revert = true
